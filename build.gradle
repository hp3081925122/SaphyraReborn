// 26.2 NeoForge。构建配置基于本机 26.2 NeoForge 环境，保留 GeckoLib 与辅助依赖。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    interfaceInjectionData = files("src/main/resources/META-INF/interface_injections.json")

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('selfmcpWindow')) {
                systemProperty 'selfmcp.window', project.property('selfmcpWindow').toString()
            }
            if (project.hasProperty('renderPreviewOut')) {
                systemProperty 'render_preview.outputDir', project.property('renderPreviewOut').toString()
            }
            if (project.hasProperty('quickPlaySingleplayer')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlaySingleplayer').toString())
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    implementation "maven.modrinth:8BmcQJ2H:IEGPh4CJ"
    implementation "maven.modrinth:u6dRKJwZ:lU7Sz0zI"
    implementation "maven.modrinth:nvQzSEkH:GBES6etT"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            geckolib_version_range: project.geckolib_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '400'])
}
